<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo 75 - Mesa en Vivo 🎀</title>
<style>
body{font-family:sans-serif;background:#fff0f6;text-align:center;padding:10px;margin:0}
.mesa{background:#000;color:#fff;padding:14px;border-radius:18px;margin-bottom:12px;position:sticky;top:0;z-index:10}
.carton{display:inline-block;border-radius:18px;padding:12px;margin:8px;width:280px;vertical-align:top;box-shadow:0 4px 10px rgba(0,0,0,0.15)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.celda{aspect-ratio:1;border:1.8px solid #000;display:flex;align-items:center;justify-content:center;font-weight:bold;background:#fff;border-radius:10px;font-size:18px;cursor:pointer;transition:0.2s}
.marcada{background:#ff1493!important;color:#fff!important;transform:scale(1.08);box-shadow:0 0 8px #ff1493}
.letra{font-weight:900;font-size:22px;margin-bottom:2px}
.colores button{width:28px;height:28px;border-radius:50%;border:2.5px solid #fff;margin:3px;cursor:pointer}
button{padding:11px 20px;border-radius:22px;border:none;font-weight:bold;cursor:pointer}
.cantar{background:#000;color:#fff;font-size:19px;border:2px solid #ff1493}
.free{background:#000!important;color:#fff!important}
select{padding:5px 8px;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<div class="mesa">
<h2 style="margin:6px">🖤🎀 Mesa: MIERCOLES 🎀🖤</h2>
<p style="margin:6px">Dinámica: <select id="patron"><option value="linea">LINEA</option><option value="4esquinas">4 ESQUINAS</option><option value="cruz">CRUZ</option><option value="x">X</option><option value="full" selected>BINGO COMPLETO</option></select></p>
<p id="ultimaBola" style="font-size:32px;margin:8px;font-weight:900">Bola: --</p>
<button class="cantar" onclick="cantarBola()">🔥 CANTAR BOLA</button>
<button onclick="agregarCarton()" style="background:#ffb6d9">+ Carton</button>
<p id="contador" style="font-size:13px;opacity:0.8">0/75 bolas</p>
</div>
<div id="cartones"></div>

<script>
let cartones=[]; let bolas=[];
let colores=["#ffb6d9","#a0e7ff","#b9fbc0","#fff475","#000000","#ff1493","#ffffff"];

function numeroUnico(min,max,usados){
  let n; do{n=Math.floor(Math.random()*(max-min+1))+min}while(usados.has(n)); usados.add(n); return n;
}
function crearCarton(){
  let usados=new Set(); let numsCol=[];
  for(let col=0;col<5;col++){
    for(let row=0;row<5;row++){
      let min=col*15+1, max=col*15+15;
      if(row==2 && col==2){ numsCol.push("FREE"); continue; }
      numsCol.push(numeroUnico(min,max,usados));
    }
  }
  let porFilas=[];
  for(let r=0;r<5;r++) for(let c=0;c<5;c++) porFilas.push(numsCol[c*5+r]);
  return {nums:porFilas, marcados:["FREE"], color:colores[0], gano:false}
}
function agregarCarton(){if(cartones.length>=6)return alert("Max 6 cartones"); cartones.push(crearCarton()); render()}
function render(){
  let c=document.getElementById("cartones"); c.innerHTML="";
  cartones.forEach((cart,idx)=>{
    let d=document.createElement("div"); d.className="carton"; d.style.background=cart.color;
    if(cart.color=="#000000") d.style.color="#fff"; else d.style.color="#000";
    d.innerHTML=`
      <b>Carton ${idx+1} ${cart.gano?'🏆':''}</b>
      <div class="colores">${colores.map(col=>`<button style="background:${col};border-color:${col=='#ffffff'?'#000':'#fff'}" onclick="cartones[${idx}].color='${col}';render()"></button>`).join("")}</div>
      <div class="grid"><div class="letra">B</div><div class="letra">I</div><div class="letra">N</div><div class="letra">G</div><div class="letra">O</div></div>
      <div class="grid">${cart.nums.map(n=>{
        let isFree=n=="FREE"; let isMarc=cart.marcados.includes(n);
        return `<div class="celda ${isFree?'free':''} ${isMarc?'marcada':''}" onclick="marcar(${idx},'${n}')">${isFree?'★':n}</div>`
      }).join("")}</div>
    `;
    c.appendChild(d);
  });
}
function marcar(i,n){ if(n=="FREE")return; n=parseInt(n); if(!bolas.includes(n))return alert("¡Esa bola no ha salido aún! 🔔 Espera que la cante"); if(!cartones[i].marcados.includes(n)){cartones[i].marcados.push(n); render(); checkWin(i)}}
function cantarBola(){
  let n; if(bolas.length>=75)return alert("¡Ya salieron las 75 bolas!");
  do{n=Math.floor(Math.random()*75)+1}while(bolas.includes(n));
  bolas.push(n);
  document.getElementById("ultimaBola").innerText="Bola: "+n;
  document.getElementById("contador").innerText=bolas.length+"/75 bolas";
  let letra = n<=15?'B':n<=30?'I':n<=45?'N':n<=60?'G':'O';
  document.getElementById("ultimaBola").innerText=letra+" - "+n;
  try{
    let msg = new SpeechSynthesisUtterance(letra+" "+n);
    msg.lang='es-ES'; msg.rate=0.9; speechSynthesis.speak(msg);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(80);
  render();
}
function checkWin(i){
  if(cartones[i].gano) return;
  let p=document.getElementById("patron").value;
  let nums=cartones[i].nums; let m=cartones[i].marcados;
  let pos = nums.map(n=> m.includes(n)? 1:0);
  let gana=false;
  if(p=="linea"){ for(let r=0;r<5;r++){ if(pos.slice(r*5,r*5+5).every(v=>v==1)) gana=true; } }
  if(p=="4esquinas"){ if(pos[0]&&pos[4]&&pos[20]&&pos[24]) gana=true; }
  if(p=="full"){ if(m.length>=24) gana=true; }
  if(p=="cruz"){ if(pos[2]&&pos[7]&&pos[12]&&pos[17]&&pos[22] && pos[10]&&pos[11]&&pos[12]&&pos[13]&&pos[14]) gana=true; }
  if(p=="x"){ if(pos[0]&&pos[6]&&pos[12]&&pos[18]&&pos[24] && pos[4]&&pos[8]&&pos[12]&&pos[16]&&pos[20]) gana=true; }
  if(gana){
    cartones[i].gano=true;
    if(navigator.vibrate) navigator.vibrate([200,100,300]);
    try{ let msg=new SpeechSynthesisUtterance("¡Ganó cartón "+(i+1)+" "+p); msg.lang='es-ES'; speechSynthesis.speak(msg);}catch(e){}
    setTimeout(()=>{ alert("🎉🏆 ¡GANÓ Cartón "+(i+1)+" - "+p.toUpperCase()+"! 🖤🎀\nMesa MIERCOLES"); },200);
    render();
  }
}
agregarCarton();
</script>
</body>
  </html>
