<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo 75 - Mesa en Vivo 🎀</title>
<style>
body{font-family:sans-serif;background:#fff0f6;text-align:center;padding:10px}
.mesa{background:#000;color:#fff;padding:12px;border-radius:15px;margin-bottom:10px}
.carton{display:inline-block;border-radius:15px;padding:12px;margin:8px;width:270px;vertical-align:top}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.celda{aspect-ratio:1;border:1.5px solid #000;display:flex;align-items:center;justify-content:center;font-weight:bold;background:#fff;border-radius:8px;font-size:17px;cursor:pointer}
.marcada{background:#ff1493!important;color:#fff;transform:scale(1.05)}
.letra{font-weight:900;font-size:22px;margin-bottom:2px}
.colores button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin:3px;cursor:pointer}
button{padding:10px 18px;border-radius:20px;border:none;font-weight:bold;cursor:pointer}
.cantar{background:#000;color:#fff;font-size:18px}
.free{background:#000!important;color:#fff!important}
</style>
</head>
<body>
<div class="mesa">
<h2>🖤🎀 Mesa: MIERCOLES 🎀🖤</h2>
<p>Dinámica: <select id="patron"><option value="linea">LINEA</option><option value="4esquinas">4 ESQUINAS</option><option value="cruz">CRUZ</option><option value="x">X</option><option value="full" selected>BINGO COMPLETO</option></select></p>
<p id="ultimaBola" style="font-size:30px;margin:5px">Bola: --</p>
<button class="cantar" onclick="cantarBola()">🔥 CANTAR BOLA</button>
<button onclick="agregarCarton()" style="background:#ffb6d9">+ Carton</button>
</div>
<div id="cartones"></div>

<script>
let cartones=[]; let bolas=[];
let colores=["#ffb6d9","#a0e7ff","#b9fbc0","#fff475","#000000","#ff1493","#ffffff"];

function numeroUnico(min,max,usados){
  let n; do{n=Math.floor(Math.random()*(max-min+1))+min}while(usados.has(n)); usados.add(n); return n;
}
function crearCarton(){
  let usados=new Set(); let nums=[];
  for(let col=0;col<5;col++){
    for(let row=0;row<5;row++){
      let min=col*15+1, max=col*15+15;
      if(row==2 && col==2){ nums.push("FREE"); continue; }
      nums.push(numeroUnico(min,max,usados));
    }
  }
  // Reordenar a filas (el loop anterior es por columnas, lo pasamos a filas para dibujar)
  let porFilas=[];
  for(let r=0;r<5;r++) for(let c=0;c<5;c++) porFilas.push(nums[c*5+r]);
  return {nums:porFilas, marcados:["FREE"], color:colores[0]}
}
function agregarCarton(){if(cartones.length>=6)return alert("Max 6 cartones"); cartones.push(crearCarton()); render()}
function render(){
  let c=document.getElementById("cartones"); c.innerHTML="";
  cartones.forEach((cart,idx)=>{
    let d=document.createElement("div"); d.className="carton"; d.style.background=cart.color;
    if(cart.color=="#000000") d.style.color="#fff"; else d.style.color="#000";
    d.innerHTML=`
      <b>Carton ${idx+1}</b>
      <div class="colores">${colores.map(col=>`<button style="background:${col};border-color:${col=='#ffffff'?'#000':'#fff'}" onclick="cartones[${idx}].color='${col}';render()"></button>`).join("")}</div>
      <div class="grid"><div class="letra">B</div><div class="letra">I</div><div class="letra">N</div><div class="letra">G</div><div class="letra">O</div></div>
      <div class="grid">${cart.nums.map(n=>{
        let isFree=n=="FREE"; let isMarc=cart.marcados.includes(n);
        return `<div class="celda ${isFree?'free':''} ${isMarc?'marcada':''}" onclick="marcar(${idx},'${n}')">${isFree?'★':n}</div>`
      }).join("")}</div>
    `;
    c.appendChild(d);
  });
}
function marcar(i,n){ if(n=="FREE")return; n=parseInt(n); if(!bolas.includes(n))return alert("¡Esa bola no ha salido!"); if(!cartones[i].marcados.includes(n))cartones[i].marcados.push(n); render(); checkWin(i)}
function cantarBola(){let n; if(bolas.length>=75)return alert("Ya salieron todas!"); do{n=Math.floor(Math.random()*75)+1}while(bolas.includes(n)); bolas.push(n); document.getElementById("ultimaBola").innerText="Bola: "+n+" ("+bolas.length+"/75)"; render()}
function checkWin(i){let p=document.getElementById("patron").value; let m=cartones[i].marcados; if(p=="full"&&m.length>=25)alert("¡BINGO COMPLETO Carton "+(i+1)+"! 🎉🖤🎀");}

agregarCarton();
</script>
</body>
</html>
