<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Bingo 75 Boa Vista</title><style>body{background:#0f172a;color:#fff;font-family:Arial;text-align:center;padding:10px}h1{color:#22c55e}#bola{font-size:80px;background:#1e293b;color:#22c55e;font-weight:900;padding:20px;border-radius:20px;max-width:280px;margin:10px auto}.carton{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:380px;margin:15px auto}.n{background:#1e293b;padding:14px 2px;border-radius:8px}.sel{background:#22c55e;color:#000}button{background:#22c55e;border:0;padding:16px 22px;border-radius:12px;font-weight:900;font-size:18px;margin:5px;color:#000}#lista{word-break:break-all}</style></head><body><h1>BINGO 75 BOA VISTA</h1><div id="bola">-</div><p id="info">0 / 75</p><button onclick="cantar()">CANTAR BOLA</button><button onclick="location.reload()">REINICIAR</button><div id="lista"></div><div id="carton" class="carton"></div><script>let c=[],s=[];for(let i=1;i<=75;i++)c.push(i);let cart=[];for(let col=0;col<5;col++){let m=col*15+1,M=m+14,a=[];while(a.length<5){let n=Math.floor(Math.random()*(M-m+1))+m;if(!a.includes(n))a.push(n)}cart.push(a)}function dib(){let h="";for(let r=0;r<5;r++)for(let col=0;col<5;col++){let n=cart[col][r];let f=r==2&&col==2;let t=f?"FREE":n;let cl=s.includes(n)||f?"n sel":"n";h+=`<div class="${cl}" onclick="this.classList.toggle('sel')">${t}</div>`}document.getElementById("carton").innerHTML=h;document.getElementById("lista").innerHTML=s.join(" - ");document.getElementById("info").innerText=s.length+" / 75"}function cantar(){if(!c.length)return alert("FIN");let i=Math.floor(Math.random()*c.length);let b=c.splice(i,1)[0];s.push(b);document.getElementById("bola").innerHTML=b;dib()}dib();</script></body></html>
